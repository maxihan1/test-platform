# 작성 에이전트가 올린 케이스 PR(author-<번호>)만 검사한다.
#
# 사람 PR 은 맥의 pre-push 가 같은 검사를 이미 돌려서 여기서는 건너뛴다 (2026-10-09 사용자 — 서비스 전 · 혼자 작업).
# 작성 에이전트는 사본 저장소에서 push 해 pre-push 를 안 거치므로(scripts/authoring-copy.ts) 이 잡이 유일한 검사이고,
# 에이전트가 이 결과를 읽고 병합한다(scripts/authoring-merge.ts `CI판정`).
#
# ⚠️ job 이름 `check` 는 main 브랜치 보호의 필수 체크 이름이다. 조건으로 건너뛴 잡은 GitHub 이 통과로 센다 —
#    그래서 사람 PR 은 기다림 없이 병합된다. 이름을 바꾸면 모든 PR 이 잠긴다.
name: ci
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
permissions:
  contents: read
jobs:
  check:
    if: github.event.pull_request.draft == false && startsWith(github.head_ref, 'author-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      # --no-held — 값을 안 채운 보류 케이스(held)가 main 에 못 들어가게 한다 (K13)
      - name: 테스트 코드 규칙 검사 (SPEC §4 K표)
        run: npm run check:tests -- --no-held
      - name: 비밀값 이름 목록이 세 곳에서 갈라지지 않았나 (SPEC §4.1)
        run: npm run check:secret-names
