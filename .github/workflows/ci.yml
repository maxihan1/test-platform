# 테스트 코드 규칙(SPEC §4 K1~K10)·타입·단위 테스트를 푸시마다 검사한다. 사람이 쓴 테스트 코드도 같은 규칙을 지키게 하기 위한 관문
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 골격이 없으면 통과
        id: skeleton
        run: |
          if [ -f package-lock.json ]; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "Phase 0 전이라 검사할 코드가 없다. 통과."
          fi
      - name: 의존성 설치
        if: steps.skeleton.outputs.ready == '1'
        run: npm ci
      - name: 타입 검사
        if: steps.skeleton.outputs.ready == '1'
        run: npm run typecheck --if-present
      - name: 단위 테스트 (연속 3회 — 1회 통과는 증거가 못 된다)
        if: steps.skeleton.outputs.ready == '1'
        run: npm run test --if-present && npm run test --if-present && npm run test --if-present
      - name: 테스트 코드 규칙 검사 (SPEC §4 K1~K10)
        if: steps.skeleton.outputs.ready == '1'
        run: npm run check:tests --if-present
      - name: SPEC 문서 검사 (없는 절·깨진 링크·색인 분량)
        if: steps.skeleton.outputs.ready == '1'
        run: npm run check:spec --if-present
