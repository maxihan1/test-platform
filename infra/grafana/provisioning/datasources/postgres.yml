# 대시보드가 붙는 Postgres 데이터소스. 읽기 전용 계정으로만 붙는다 (SPEC §8.5 · §6)
# url 은 컨테이너 망 안에서 본 주소다. 호스트의 5433 이 아니다

apiVersion: 1

datasources:
  - name: platform-postgres
    uid: platform-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    editable: false
    secureJsonData:
      # compose 가 grafana 에 넘긴 값이다. postgres 가 계정을 만들 때 읽은 칸과 같다 (SPEC 공통/6 §9 「DB 비밀번호」)
      password: $GRAFANA_RO_PASSWORD
    jsonData:
      # 바깥 칸 database 는 옛 자리다 — Grafana 13 화면은 이 칸만 읽고, 없으면 쿼리를 보내기 전에 「default database」 오류로 막는다
      database: platform
      sslmode: disable
      postgresVersion: 1600
