# 대시보드가 붙는 Postgres 데이터소스. 읽기 전용 계정으로만 붙는다 (SPEC §8.5 · §6)
# url 은 컨테이너 망 안에서 본 주소다. 호스트의 5433 이 아니다

apiVersion: 1

datasources:
  - name: platform-postgres
    uid: platform-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: platform
    user: grafana_ro
    isDefault: true
    editable: false
    secureJsonData:
      password: grafana_ro
    jsonData:
      sslmode: disable
      postgresVersion: 1600
