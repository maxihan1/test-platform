# SPEC §9 인프라. 상시 컨테이너 4개 + 마이그레이션 일회성 1개
# 러너와 admin 둘 다 Playwright 공식 이미지에서 시작한다. 이미지 태그와 @playwright/test 버전은 정확히 같아야 한다

services:
  postgres:
    image: postgres:16
    # 서버가 재부팅돼도 사람이 손대지 않고 돌아온다. DB가 안 뜨면 admin의 재기동 복구도 돌지 못한다 (SPEC §9)
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      # G1에서 사람이 run_item을 직접 열어봐야 한다. 개발 PC에 이미 PostgreSQL이 깔린 경우가 많아
      # 호스트 쪽은 5433으로 비켜 쓴다 (컨테이너끼리는 그대로 5432로 통신한다).
      # 숫자를 박아 두면 한 서버에서 다른 것과 포트를 다툰다. 기본값은 지금 쓰던 숫자 그대로다 (SPEC §9)
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
    volumes:
      - ./db:/db:ro
    command: ["--migrations-dir", "/db/migrations", "--no-dump-schema", "up"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      RUNNER_URL: http://runner:4000
      PLATFORM_TESTS_DIR: /tests
      PLATFORM_ARTIFACTS_DIR: /artifacts
      PORT: "3000"
      # 로그인 세션을 서명하는 키. DB에 둘 수 없다. 없으면 admin이 기동을 거부한다 (SPEC §9 · §3.5).
      # 서비스 이름·색·저장소·대상 서버 주소는 환경변수가 아니라 DB에 있다 (§6 service·service_env)
      SESSION_SECRET: "${SESSION_SECRET}"
      # 이 플랫폼이 바깥에서 열리는 주소. Slack 알림의 링크가 이 값 위에 붙는다 (§8.9).
      # 비면 알림에 링크를 넣지 않는다 — 틀린 주소를 보내는 것보다 없는 편이 낫다
      PLATFORM_PUBLIC_URL: "${PLATFORM_PUBLIC_URL:-}"
    volumes:
      - ./tests:/tests:ro      # 스캔과 실패 지점 코드 발췌가 소스를 읽는다
      - artifacts:/artifacts   # 스크린샷 서빙, 증적 문서 저장

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    restart: unless-stopped
    # 바깥 포트를 열지 않는다. admin이 컨테이너 네트워크 안에서만 부른다.
    # 러너에는 로그인이 없어 포트가 열려 있으면 인증을 건너뛰는 뒷길이 된다 (SPEC §3.5 · §9).
    # 손으로 볼 때는 docker compose exec runner wget -qO- localhost:4000/health
    environment:
      PLATFORM_TESTS_DIR: /tests
      PLATFORM_ARTIFACTS_DIR: /artifacts
      PORT: "4000"
    volumes:
      - ./tests:/tests:ro      # 테스트 소스 읽기 전용 마운트
      - artifacts:/artifacts   # 스크린샷 공유 볼륨 (admin과 공유)
    mem_limit: 4g              # 폭주해도 admin을 끌고 내려가지 않게

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro   # WS-D가 채운다

volumes:
  pgdata: {}
  artifacts: {}
