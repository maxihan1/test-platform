# SPEC §9 인프라. 상시 컨테이너 4개 + 마이그레이션 일회성 1개
# 러너와 admin 둘 다 Playwright 공식 이미지에서 시작한다. 이미지 태그와 @playwright/test 버전은 정확히 같아야 한다

services:
  postgres:
    image: postgres:16
    # 서버가 재부팅돼도 사람이 손대지 않고 돌아온다. DB가 안 뜨면 admin의 재기동 복구도 돌지 못한다 (SPEC §9)
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      # G1에서 사람이 run_item을 직접 열어봐야 한다. 개발 PC에 이미 PostgreSQL이 깔린 경우가 많아
      # 호스트 쪽은 5433으로 비켜 쓴다 (컨테이너끼리는 그대로 5432로 통신한다).
      # 숫자를 박아 두면 한 서버에서 다른 것과 포트를 다툰다. 기본값은 지금 쓰던 숫자 그대로다 (SPEC §9)
      # 이 기계 안(127.0.0.1)에만 연다 — 모든 주소에 열면 망이 갈린 author 가 게이트웨이로 돌아 DB 에 닿는다 (2026-09-23).
      # 다른 기계에서 DB 를 볼 때는 ssh 터널로 온다
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # grafana 가 읽기 전용 계정으로 붙는다. 러너가 있는 기본 망과 따로 둔다 (2026-09-28 망 분리)
    networks: [default, dashboard]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
    volumes:
      - ./db:/db:ro
    command: ["--migrations-dir", "/db/migrations", "--no-dump-schema", "up"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      RUNNER_URL: http://runner:4000
      PLATFORM_TESTS_DIR: /tests
      PLATFORM_ARTIFACTS_DIR: /artifacts
      PORT: "3000"
      # 로그인 세션을 서명하는 키. DB에 둘 수 없다. 없으면 admin이 기동을 거부한다 (SPEC §9 · §3.5).
      # 서비스 이름·색·저장소·대상 서버 주소는 환경변수가 아니라 DB에 있다 (§6 service·service_env)
      SESSION_SECRET: "${SESSION_SECRET}"
      # 이 플랫폼이 바깥에서 열리는 주소. Slack 알림의 링크가 이 값 위에 붙는다 (§8.9).
      # 비면 알림에 링크를 넣지 않는다 — 틀린 주소를 보내는 것보다 없는 편이 낫다
      PLATFORM_PUBLIC_URL: "${PLATFORM_PUBLIC_URL:-}"
      # 작성 에이전트(서버 author · 맥은 대체)가 쓰는 계정 아이디 (SPEC 도메인/작성 §3.6).
      # **비면 아무도 작성 요청을 집어가지 못한다** — 열어 두면 그 서비스에 배정된 아무
      # 실행 등급 계정이 에이전트보다 먼저 집어 병합될 PR 주소를 바꿔치기할 수 있다.
      # 그 계정은 operator 여야 한다. admin 을 주면 비밀값 하나가 /api/settings/** 전부를 연다
      AUTHORING_AGENT_USER: "${AUTHORING_AGENT_USER:-}"
      # /grafana/ 아래 요청을 넘겨줄 곳. grafana 는 바깥 포트가 없어 dashboard 망 안의 이름으로 닿는다 (SPEC §9.2)
      GRAFANA_URL: "${GRAFANA_URL:-http://grafana:3000}"
      # 케이스 「테스트 실행」이 브라우저 창을 띄울 러너 주소. 비면 테스트 실행이 꺼진다 — 켜는 법은 docs/SETUP.md 「내 컴퓨터 러너」
      LOCAL_RUNNER_URL: "${LOCAL_RUNNER_URL:-}"
    # 컨테이너에서 호스트(내 컴퓨터)의 러너에 닿는 이름. 맥 Docker Desktop 에서만 127.0.0.1 전용 러너에 닿는 것을 확인했다 —
    # 리눅스는 이 줄로 이름은 풀려도 브리지 주소라 안 닿을 수 있다 (docs/SETUP.md 「내 컴퓨터 러너」)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./tests:/tests:ro      # 스캔과 실패 지점 코드 발췌가 소스를 읽는다
      # 스크린샷 서빙, 증적 문서 저장. 기본은 이름 붙은 볼륨이다 — 로컬 러너(Android 앱)를 쓰는 맥은 ./artifacts 를 적어
      # 그 러너가 쓰는 폴더를 같이 본다. 안 그러면 앱 스크린샷이 오류 없이 404 다 (SPEC 공통/6-인프라 §9.2)
      - ${PLATFORM_ARTIFACTS_VOLUME:-artifacts}:/artifacts
    # 작성 에이전트(author)는 authoring 망에서만 admin 에 닿는다 — 기본 망의 postgres·runner 에는 못 닿게.
    # grafana 는 dashboard 망에서 admin 이 대신 연다 (2026-09-28)
    networks: [default, authoring, dashboard]

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    restart: unless-stopped
    # 바깥 포트를 열지 않는다. admin이 컨테이너 네트워크 안에서만 부른다.
    # 러너에는 로그인이 없어 포트가 열려 있으면 인증을 건너뛰는 뒷길이 된다 (SPEC §3.5 · §9).
    # 손으로 볼 때는 docker compose exec runner wget -qO- localhost:4000/health
    environment:
      PLATFORM_TESTS_DIR: /tests
      PLATFORM_ARTIFACTS_DIR: /artifacts
      PORT: "4000"
    volumes:
      - ./tests:/tests:ro      # 테스트 소스 읽기 전용 마운트
      - ${PLATFORM_ARTIFACTS_VOLUME:-artifacts}:/artifacts   # 스크린샷 공유 볼륨 (admin과 같은 값을 본다)
    mem_limit: 4g              # 폭주해도 admin을 끌고 내려가지 않게

  # 작성 에이전트 — 화면이 세운 줄을 서버 안에서 집어 케이스를 만들고 PR 을 낸다 (SPEC 도메인/작성 §3.6 · 공통/6 §9).
  # **선택 사항이다.** 토큰 셋을 .env 에 넣은 뒤 `docker compose --profile authoring up -d author` 로 켠다 (docs/SETUP.md §8)
  author:
    profiles: [authoring]
    build:
      context: .
      dockerfile: apps/authoring/Dockerfile
    # 토큰이 틀리면 [거부] 로 끝난다. 끝없이 다시 켜지 않는다
    restart: on-failure:5
    # 거둔 자식의 Chromium 이 고아로 남으면 init 이 거둔다 — node 는 자기 자식만 거둬 좀비가 쌓인다
    init: true
    # **root 로 켠다** (2026-09-24) — 자식 claude 를 다른 uid 로 띄워야 에이전트의 토큰을 못 읽는다.
    # 서버 저장소에 쓰는 일(부품 맞추기·병합 뒤 당기기)은 HOST_UID 로 한다 — root 소유 파일을 안 남긴다
    depends_on:
      - admin
    environment:
      PLATFORM_ADMIN_URL: http://admin:3000
      HOST_UID: "${HOST_UID:-1000}"          # 서버 저장소 주인. 리눅스는 `id -u`
      HOST_GID: "${HOST_GID:-1000}"
      # 자식 claude 의 uid. 자리 k 는 이 값 + k 다. 0 이나 HOST_UID 와 겹치면 켜지지 않는다
      AUTHORING_CHILD_UID: "${AUTHORING_CHILD_UID:-20000}"
      AUTHORING_MAX_PARALLEL: "${AUTHORING_MAX_PARALLEL:-2}"   # 늘리면 mem_limit 도 한 건 4g 씩 늘린다
      AUTHORING_MODEL: "${AUTHORING_MODEL:-claude-opus-5-5}"    # 메인만 — 보조는 .claude/agents 정의 (2026-10-04)
      AUTHORING_EFFORT: "${AUTHORING_EFFORT:-high}"             # low · medium · high · xhigh · max
      AUTHORING_FALLBACK_MODEL: "${AUTHORING_FALLBACK_MODEL:-sonnet}"   # 과부하·미제공일 때만 넘어간다. none 이면 끈다
      # 켤 때와 하루 한 번 받는다. 점검(깃발)을 못 넘으면 직전 판으로 되돌린다. 0 이면 이미지 판 그대로
      AUTHORING_CLAUDE_AUTOUPDATE: "${AUTHORING_CLAUDE_AUTOUPDATE:-1}"
      AUTHORING_CLAUDE_VERSION: "${AUTHORING_CLAUDE_VERSION:-stable}"   # stable · latest · x.y.z
      AUTHORING_WORK_DIR: /work
      # 설정 > 계정 > 작성 계정 > 에이전트 토큰. 에이전트만 쓰고 자식 세션에는 안 넘긴다
      AUTHORING_AGENT_TOKEN: "${AUTHORING_AGENT_TOKEN:-}"
      # `claude setup-token` 으로 만든 구독 토큰(sk-ant-oat…). API 키를 넣으면 실비 청구다 — 시작 스크립트가 막는다.
      # **고객사 서버는 그 회사 Claude 계정의 토큰이다** (SPEC 도메인/작성 §3.6)
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      # 선택. 월간 API 크레딧을 받은 Console 조직의 API 키(sk-ant-…, 구독 토큰 sk-ant-oat… 아님) — 크레딧 먼저, 떨어지면 구독(SPEC 공통/6 §9 · SETUP.md)
      AUTHORING_CREDIT_KEY: "${AUTHORING_CREDIT_KEY:-}"
      # PR 열기·병합 권한. 자식 세션에는 가짜 값으로 덮어 넘긴다
      GH_TOKEN: "${GH_TOKEN:-}"
      DISABLE_AUTOUPDATER: "1"   # claude 가 스스로 올리지 않는다 — 올리는 것은 에이전트다(점검·되돌리기)
    volumes:
      - ./:/repo                              # 사본의 원천 · 병합 뒤 당기기(admin 의 /tests 가 바로 본다). 자식은 여기 못 쓴다(다른 uid)
      - /dev/null:/repo/.env:ro               # 비밀값 파일을 가린다. 자식 세션은 셸로 /repo 를 읽는다
      - author_node_modules:/repo/node_modules   # 리눅스용 부품. 호스트(맥) 것은 네이티브 부품이 달라 못 쓴다
      - author_work:/work                     # 작업 폴더. 중단된 작성은 7일 보관해 이어간다 — 컨테이너를 다시 만들어도 남아야 한다 (SPEC 도메인/작성 §7)
    networks: [authoring]
    mem_limit: 8g             # 한 건(claude + 관문 3회 Chromium) 4g × 동시 상한(기본 2건 — AUTHORING_MAX_PARALLEL)
    shm_size: 2g              # Chromium 이 /dev/shm 을 넉넉히 쓴다

  grafana:
    image: grafana/grafana:13.2.2   # 실측한 판으로 고정 — 올릴 때는 auth proxy 확인을 다시 돈다 (SPEC 공통/6 §9.1)
    restart: unless-stopped
    # 바깥 포트를 열지 않는다 (2026-09-28). admin 이 /grafana/ 로 대신 열고 로그인한 사람 이름을 헤더로 넘긴다.
    # Grafana 는 그 헤더를 믿으므로 admin 말고는 닿으면 안 된다 — 러너와 같은 망에 두지 않는다 (도메인/인증 §7 「Grafana 통로」)
    depends_on:
      postgres:
        condition: service_healthy
    # 뜻은 SPEC 공통/6 §9.2 「Grafana 를 로그인 뒤에 두기」 표에 있다. 값의 정본은 여기다
    environment:
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-WEBAUTH-USER"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"          # Basic admin:admin 이 다른 로그인 방식으로 먹지 않게
      GF_AUTH_SIGNOUT_REDIRECT_URL: "/"       # 로그인 폼이 없어 그대로 두면 곧바로 다시 들어온다
      # 플랫폼 기본 계정도 admin 이다. 같은 이름의 Grafana 관리자가 있으면 그 사람이 최고 관리자로 들어간다
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_LIVE_MAX_CONNECTIONS: "0"            # 실시간 연결을 끈다 — 연결마다 문을 거치게 할 코드가 없다
      # %(protocol)s 는 compose 변수가 아니라 Grafana 가 채우는 자리다. $ 가 없어 compose 가 건드리지 않는다
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro   # WS-D가 채운다
    networks: [dashboard]     # admin · postgres 하고만

volumes:
  pgdata: {}
  artifacts: {}
  author_node_modules: {}
  author_work: {}

networks:
  default: {}
  authoring: {}
  dashboard: {}   # admin · grafana · postgres 만 (2026-09-28)
