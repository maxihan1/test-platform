# SPEC §9 인프라. 상시 컨테이너 4개 + 마이그레이션 일회성 1개
# 러너와 admin 둘 다 Playwright 공식 이미지에서 시작한다. 이미지 태그와 @playwright/test 버전은 정확히 같아야 한다

services:
  postgres:
    image: postgres:16
    # 서버가 재부팅돼도 사람이 손대지 않고 돌아온다. DB가 안 뜨면 admin의 재기동 복구도 돌지 못한다 (SPEC §9)
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      # G1에서 사람이 run_item을 직접 열어봐야 한다. 개발 PC에 이미 PostgreSQL이 깔린 경우가 많아
      # 호스트 쪽은 5433으로 비켜 쓴다 (컨테이너끼리는 그대로 5432로 통신한다).
      # 숫자를 박아 두면 한 서버에서 다른 것과 포트를 다툰다. 기본값은 지금 쓰던 숫자 그대로다 (SPEC §9)
      # 이 기계 안(127.0.0.1)에만 연다 — 모든 주소에 열면 망이 갈린 author 가 게이트웨이로 돌아 DB 에 닿는다 (2026-09-23).
      # 다른 기계에서 DB 를 볼 때는 ssh 터널로 온다
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform?sslmode=disable
    volumes:
      - ./db:/db:ro
    command: ["--migrations-dir", "/db/migrations", "--no-dump-schema", "up"]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # 「그래프 ↗」 링크가 가리킬 Grafana 포트. 화면 번들에 구워지므로 빌드로 넘겨야 한다 —
        # 아래 grafana 의 포트 매핑은 실행 시점 값이라 화면까지 오지 않는다 (SPEC §9.2).
        # 이 값을 바꾸면 admin 이미지를 다시 빌드해야 한다
        VITE_GRAFANA_PORT: "${GRAFANA_PORT:-3001}"
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      RUNNER_URL: http://runner:4000
      PLATFORM_TESTS_DIR: /tests
      PLATFORM_ARTIFACTS_DIR: /artifacts
      PORT: "3000"
      # 로그인 세션을 서명하는 키. DB에 둘 수 없다. 없으면 admin이 기동을 거부한다 (SPEC §9 · §3.5).
      # 서비스 이름·색·저장소·대상 서버 주소는 환경변수가 아니라 DB에 있다 (§6 service·service_env)
      SESSION_SECRET: "${SESSION_SECRET}"
      # 이 플랫폼이 바깥에서 열리는 주소. Slack 알림의 링크가 이 값 위에 붙는다 (§8.9).
      # 비면 알림에 링크를 넣지 않는다 — 틀린 주소를 보내는 것보다 없는 편이 낫다
      PLATFORM_PUBLIC_URL: "${PLATFORM_PUBLIC_URL:-}"
      # 작성 에이전트(서버 author · 맥은 대체)가 쓰는 계정 아이디 (SPEC 도메인/작성 §3.6).
      # **비면 아무도 작성 요청을 집어가지 못한다** — 열어 두면 그 서비스에 배정된 아무
      # 실행 등급 계정이 에이전트보다 먼저 집어 병합될 PR 주소를 바꿔치기할 수 있다.
      # 그 계정은 operator 여야 한다. admin 을 주면 비밀값 하나가 /api/settings/** 전부를 연다
      AUTHORING_AGENT_USER: "${AUTHORING_AGENT_USER:-}"
    volumes:
      - ./tests:/tests:ro      # 스캔과 실패 지점 코드 발췌가 소스를 읽는다
      - artifacts:/artifacts   # 스크린샷 서빙, 증적 문서 저장
    # 작성 에이전트(author)는 authoring 망에서만 admin 에 닿는다 — 기본 망의 postgres·runner 에는 못 닿게
    networks: [default, authoring]

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    restart: unless-stopped
    # 바깥 포트를 열지 않는다. admin이 컨테이너 네트워크 안에서만 부른다.
    # 러너에는 로그인이 없어 포트가 열려 있으면 인증을 건너뛰는 뒷길이 된다 (SPEC §3.5 · §9).
    # 손으로 볼 때는 docker compose exec runner wget -qO- localhost:4000/health
    environment:
      PLATFORM_TESTS_DIR: /tests
      PLATFORM_ARTIFACTS_DIR: /artifacts
      PORT: "4000"
    volumes:
      - ./tests:/tests:ro      # 테스트 소스 읽기 전용 마운트
      - artifacts:/artifacts   # 스크린샷 공유 볼륨 (admin과 공유)
    mem_limit: 4g              # 폭주해도 admin을 끌고 내려가지 않게

  # 작성 에이전트 — 화면이 세운 줄을 서버 안에서 집어 케이스를 만들고 PR 을 낸다 (SPEC 도메인/작성 §3.6 · 공통/6 §9).
  # **선택 사항이다.** 토큰 셋을 .env 에 넣은 뒤 `docker compose --profile authoring up -d author` 로 켠다 (docs/SETUP.md §8)
  author:
    profiles: [authoring]
    build:
      context: .
      dockerfile: apps/authoring/Dockerfile
    # 토큰이 틀리면 [거부] 로 끝난다. 끝없이 다시 켜지 않는다
    restart: on-failure:5
    # root 로 돌면 서버 저장소에 root 소유 파일이 남아 사람이 git pull 을 못 한다
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      - admin
    environment:
      PLATFORM_ADMIN_URL: http://admin:3000
      # 설정 > 계정 > 작성 계정 > 에이전트 토큰. 에이전트만 쓰고 자식 세션에는 안 넘긴다
      AUTHORING_AGENT_TOKEN: "${AUTHORING_AGENT_TOKEN:-}"
      # `claude setup-token` 으로 만든 구독 토큰(sk-ant-oat…). API 키를 넣으면 실비 청구다 — 시작 스크립트가 막는다.
      # **고객사 서버는 그 회사 Claude 계정의 토큰이다** (SPEC 도메인/작성 §3.6)
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
      # PR 열기·병합 권한. 자식 세션에는 가짜 값으로 덮어 넘긴다
      GH_TOKEN: "${GH_TOKEN:-}"
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - ./:/repo                              # 작업방·PR·병합 뒤 당기기가 서버 저장소에서 일어난다 — admin 의 /tests 가 바로 본다
      - /dev/null:/repo/.env:ro               # 비밀값 파일을 가린다. 자식 세션은 셸로 /repo 를 읽는다
      - author_node_modules:/repo/node_modules   # 리눅스용 부품. 호스트(맥) 것은 네이티브 부품이 달라 못 쓴다
    networks: [authoring]
    mem_limit: 4g             # claude + 관문 3회 Chromium
    shm_size: 1g              # Chromium 이 /dev/shm 을 넉넉히 쓴다

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro   # WS-D가 채운다

volumes:
  pgdata: {}
  artifacts: {}
  author_node_modules: {}

networks:
  default: {}
  authoring: {}
